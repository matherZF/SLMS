spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:spare_parts_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  sql:
    init:
      mode: never

jwt:
  secret: test-only-secret-with-at-least-32-bytes
  expiration: 3600000

device:
  datasource:
    enabled: false

app:
  cors:
    allowed-origins: http://localhost:5173
